services:
  - type: worker
    name: chrixhelp-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m bot.main
    autoDeploy: true
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: AI_TEMPERATURE
        value: "0.3"
      - key: QUIZ_TEMPERATURE
        value: "0.1"
      - key: QUIZ_DIFFICULTY
        value: challenging
